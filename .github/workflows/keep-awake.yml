name: Keep Render awake

on:
  schedule:
    # ponytail: GitHub's scheduler is best-effort (can skip runs under load) and
    # disables schedules after 60 days with no commits to the repo. Switch to
    # UptimeRobot (or similar) if either becomes a real problem.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS https://invoicepilot-0sc2.onrender.com/health
